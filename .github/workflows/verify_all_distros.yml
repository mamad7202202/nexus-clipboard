name: Comprehensive Multi-Distro Verification & CI

on:
  workflow_dispatch:
  push:
    branches:
      - verify-distros
      - fix-linux-clipboard-copyq-model
      - main

permissions:
  issues: write
  contents: write

jobs:
  test-ubuntu:
    name: Ubuntu 22.04 (X11 & Wayland Build & Tests)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libxfixes-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb \
            xclip \
            wl-clipboard

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Run Cargo Check & Capture Log
        id: cargo_check
        continue-on-error: true
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | tee cargo_check.log
          exit ${PIPESTATUS[0]}

      - name: Post Cargo Check Log to Issue if Failed
        if: steps.cargo_check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('cargo_check.log') ? fs.readFileSync('cargo_check.log', 'utf8') : 'No log';
            const lines = log.split('\n');
            const summary = lines.slice(-100).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Ubuntu CI Cargo Check Failure Log',
              body: '```text\n' + summary + '\n```'
            });

      - name: Enforce Cargo Check Status
        if: steps.cargo_check.outcome == 'failure'
        run: exit 1

      - name: Run Rust Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --verbose

      - name: Run Cargo Build Release
        run: cargo build --manifest-path src-tauri/Cargo.toml --release

      - name: Build Bundles (deb, appimage)
        run: pnpm tauri build --bundles deb,appimage

name: Test Linux Build

on:
  workflow_dispatch:
  push:
    branches:
      - test-linux-build

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libxfixes-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Cargo Check
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml 2>&1 | tee cargo_output.log || true
          mkdir -p build_logs
          cp cargo_output.log build_logs/cargo_output.txt

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: cargo-check-output
          path: build_logs/cargo_output.txt

      - name: Check success
        run: |
          cat build_logs/cargo_output.txt | grep -q "Finished" && exit 0 || exit 1

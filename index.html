<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark light" />
    <title>Nexus Clipboard</title>
    <script>
      // Apply the stored theme before first paint so the window never flashes
      // the wrong background while React boots.
      (() => {
        try {
          const stored = localStorage.getItem("nexus.theme") || "system";
          const dark =
            stored === "dark" ||
            (stored === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          const accent = localStorage.getItem("nexus.accent");
          if (accent) document.documentElement.style.setProperty("--accent", accent);
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
